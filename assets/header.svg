<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a5a8c" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3d76ad" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2a4a"/>
      <stop offset="100%" stop-color="#0a2340"/>
    </linearGradient>
  </defs>

  <!-- blueprint background -->
  <rect x="0" y="0" width="1000" height="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="220" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="220" fill="url(#gridMajor)"/>

  <!-- corner registration marks -->
  <g stroke="#7fc4ff" stroke-width="1.4" opacity="0.85">
    <path d="M 14 30 L 14 14 L 30 14"/>
    <path d="M 970 14 L 986 14 L 986 30"/>
    <path d="M 986 190 L 986 206 L 970 206"/>
    <path d="M 30 206 L 14 206 L 14 190"/>
  </g>
  <g fill="#7fc4ff" opacity="0.9" font-family="Courier New, monospace" font-size="9">
    <text x="20" y="26">FIG. 01</text>
    <text x="905" y="26">REV 5</text>
    <text x="20" y="200">SCALE N.T.S.</text>
    <text x="880" y="200">SHEET 1/1</text>
  </g>

  <!-- dimension line -->
  <g stroke="#5a9bd4" stroke-width="1" opacity="0.6">
    <line x1="40" y1="46" x2="960" y2="46"/>
    <line x1="40" y1="42" x2="40" y2="50"/>
    <line x1="960" y1="42" x2="960" y2="50"/>
  </g>

  <!-- oscilloscope trace -->
  <polyline points="0,120 40,120 55,70 70,150 85,120 130,120 145,60 155,180 170,120 220,120 235,90 250,140 265,120 320,120 335,55 350,170 365,120 420,120 435,80 450,150 465,120 520,120 535,65 550,165 565,120 620,120 635,85 650,145 665,120 720,120 735,60 750,175 765,120 820,120 835,75 850,155 865,120 920,120 935,68 950,160 965,120 1000,120"
    fill="none" stroke="#3ee6c4" stroke-width="1.8" opacity="0.85">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.4s" repeatCount="indefinite"/>
  </polyline>
  <line x1="0" y1="120" x2="1000" y2="120" stroke="#3ee6c4" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3"/>

  <!-- ground baseline (dashed, technical) -->
  <line x1="0" y1="178" x2="1000" y2="178" stroke="#7fc4ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <g fill="#7fc4ff" font-family="Courier New, monospace" font-size="8" opacity="0.6">
    <text x="45" y="192">0.00</text>
    <text x="480" y="192">500.00</text>
    <text x="930" y="192">1000.00</text>
  </g>

  <!-- ============ PENGUIN (schematic style) ============ -->
  <g id="penguin">
    <g id="penguinWaddle">
      <!-- construction circle behind penguin -->
      <circle cx="0" cy="8" r="19" fill="none" stroke="#3ee6c4" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.5"/>
      <!-- feet -->
      <polygon points="-10,26 -2,26 -6,32" fill="#f5a623"/>
      <polygon points="2,26 10,26 6,32" fill="#f5a623"/>
      <!-- body -->
      <ellipse cx="0" cy="10" rx="15" ry="20" fill="#0e2c4d" stroke="#7fc4ff" stroke-width="1.2"/>
      <!-- belly -->
      <ellipse cx="0" cy="13" rx="9" ry="14" fill="#dff3ff"/>
      <!-- wings -->
      <ellipse cx="-14" cy="8" rx="4" ry="11" fill="#0e2c4d" stroke="#7fc4ff" stroke-width="0.8" transform="rotate(-15 -14 8)"/>
      <ellipse cx="14" cy="8" rx="4" ry="11" fill="#0e2c4d" stroke="#7fc4ff" stroke-width="0.8" transform="rotate(15 14 8)"/>
      <!-- head -->
      <circle cx="0" cy="-10" r="10" fill="#0e2c4d" stroke="#7fc4ff" stroke-width="1.2"/>
      <!-- eyes -->
      <circle cx="-3.5" cy="-11" r="1.6" fill="#fff"/>
      <circle cx="3.5" cy="-11" r="1.6" fill="#fff"/>
      <circle cx="-3.5" cy="-11" r="0.7" fill="#0a2340"/>
      <circle cx="3.5" cy="-11" r="0.7" fill="#0a2340"/>
      <!-- beak -->
      <polygon points="-3,-6 3,-6 0,-2" fill="#f5a623"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 0 30;6 0 30;-6 0 30" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <animateTransform href="#penguin"
    attributeName="transform" type="translate"
    values="-30,-2; 1030,-2" dur="22s" repeatCount="indefinite"/>

</svg>
