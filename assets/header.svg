<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#123655" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .layer { opacity: 0; }
    .l-square { animation: sq 8s ease-in-out infinite; }
    .l-carrier { animation: car 8s ease-in-out infinite; }
    .l-am { animation: am 8s ease-in-out infinite; }

    @keyframes sq {
      0%   { opacity: 1; }
      10%  { opacity: 1; }
      20%  { opacity: 0; }
      65%  { opacity: 0; }
      80%  { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes car {
      0%   { opacity: 0; }
      10%  { opacity: 0; }
      20%  { opacity: 1; }
      35%  { opacity: 0; }
      50%  { opacity: 0; }
      65%  { opacity: 1; }
      80%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes am {
      0%   { opacity: 0; }
      20%  { opacity: 0; }
      35%  { opacity: 1; }
      50%  { opacity: 1; }
      65%  { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <rect x="0" y="0" width="1000" height="200" fill="#071A2F"/>
  <rect x="0" y="0" width="1000" height="200" fill="url(#grid)"/>
  <line x1="0" y1="100" x2="1000" y2="100" stroke="#123655" stroke-width="1" opacity="0.6"/>

