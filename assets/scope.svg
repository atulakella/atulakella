<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <style>
    text {
      font-family: "Liberation Mono", "Courier New", Courier, monospace;
      font-size: 15px;
      fill: #9aab9e;
      white-space: pre;
    }
    .amber { fill: #d6b98a; }

    #log { animation: cycle 11s linear infinite; }

    .l { opacity: 0; animation-duration: 11s; animation-timing-function: linear; animation-iteration-count: infinite; }
    #l1 { animation-name: a1; }
    #l2 { animation-name: a2; }
    #l3 { animation-name: a3; }
    #l4 { animation-name: a4; }
    #l5 { animation-name: a5; }
    #l6 { animation-name: a6; }

    #cur { opacity: 0; animation: curshow 11s linear infinite; }
    #blink { animation: blink 1.1s step-end infinite; }

    @keyframes cycle {
      0%     { opacity: 1; }
      81.8%  { opacity: 1; }
      95.5%  { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes a1 { 0% { opacity: 0; } 2.7%   { opacity: 1; } 100% { opacity: 1; } }
    @keyframes a2 { 0%, 6.4%  { opacity: 0; } 9.1%  { opacity: 1; } 100% { opacity: 1; } }
    @keyframes a3 { 0%, 12.7% { opacity: 0; } 15.4% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes a4 { 0%, 19.1% { opacity: 0; } 21.8% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes a5 { 0%, 24.5% { opacity: 0; } 27.3% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes a6 { 0%, 31.8% { opacity: 0; } 34.5% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes curshow { 0%, 39.9% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes blink { 0%, 50% { opacity: 0.55; } 50.01%, 100% { opacity: 0; } }
  </style>

  <rect width="900" height="260" fill="#0d0f10"/>

  <g id="log">
    <text id="l1" class="l" x="50" y="62" xml:space="preserve">[    0.000000] Linux version 7.2.9 (atul@mission-control)</text>
    <text id="l2" class="l" x="50" y="86" xml:space="preserve">[    0.421337] remoteproc remoteproc0: firmware loaded</text>
    <text id="l3" class="l" x="50" y="110" xml:space="preserve">[    0.733100] optee: secure world initialized</text>
    <text id="l4" class="l" x="50" y="134" xml:space="preserve">[    0.812441] printk: nobody reads these anyway</text>
    <text id="l5" class="l" x="50" y="158" xml:space="preserve">[    0.813027] printk: if you're reading this, you're either me or you don't have a life</text>
    <text id="l6" class="l amber" x="50" y="182" xml:space="preserve">[    1.969000] mm: you can free() any time you like, but you can never exit()</text>
    <g id="cur">
      <rect id="blink" x="50" y="195" width="8" height="14" fill="#9aab9e" opacity="0"/>
    </g>
  </g>
</svg>
