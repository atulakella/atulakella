<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <style>
    text {
      font-family: "Liberation Mono", "Courier New", Courier, monospace;
      font-size: 15px;
      font-weight: 505;
      fill: #9aab9e;
      white-space: pre;
    }

    .amber {
      fill: #ff6b9d;
    }

    #log {
      animation: cycle 28s linear infinite;
    }

    .l {
      opacity: 0;
      animation-duration: 28s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    #l1 { animation-name: a1; }
    #l2 { animation-name: a2; }
    #l3 { animation-name: a3; }
    #l4 { animation-name: a4; }
    #l5 { animation-name: a5; }
    #l6 { animation-name: a6; }

    #cur {
      opacity: 0;
      animation: curshow 28s linear infinite;
    }

    #blink {
      animation: blink 1.1s step-end infinite;
    }

    /*
      28 second cycle

      0s  - 3.8s   lines appear
      3.8s - 25s   hold
      25s - 28s    slow fade
    */

    @keyframes cycle {
      0%    { opacity: 1; }
      89.3% { opacity: 1; }
      100%  { opacity: 0; }
    }

    /* Original line timing preserved */

    @keyframes a1 {
      0%      { opacity: 0; }
      0.964%  { opacity: 1; }
      100%    { opacity: 1; }
    }

    @keyframes a2 {
      0%, 2.527% { opacity: 0; }
      3.218%     { opacity: 1; }
      100%       { opacity: 1; }
    }

    @keyframes a3 {
      0%, 4.991% { opacity: 0; }
      6.054%     { opacity: 1; }
      100%       { opacity: 1; }
    }

    @keyframes a4 {
      0%, 7.527% { opacity: 0; }
      8.618%     { opacity: 1; }
      100%       { opacity: 1; }
    }

    @keyframes a5 {
      0%, 9.664% { opacity: 0; }
      10.936%    { opacity: 1; }
      100%       { opacity: 1; }
    }

    @keyframes a6 {
      0%, 12.527% { opacity: 0; }
      13.573%     { opacity: 1; }
      100%        { opacity: 1; }
    }

    /* Cursor appears after final line */

    @keyframes curshow {
      0%, 15.418% { opacity: 0; }
      15.455%     { opacity: 1; }
      100%        { opacity: 1; }
    }

    /* Cursor blink */

    @keyframes blink {
      0%, 50% {
        opacity: 0.55;
      }

      50.01%, 100% {
        opacity: 0;
      }
    }
  </style>

  <rect width="900" height="260" fill="#0d0f10"/>

  <g id="log">

    <text
      id="l1"
      class="l"
      x="50"
      y="62"
      xml:space="preserve"
    >[    0.000000] Linux version 7.2.9 (atul@mission-control)</text>

    <text
      id="l2"
      class="l"
      x="50"
      y="86"
      xml:space="preserve"
    >[    0.421337] remoteproc remoteproc0: firmware loaded</text>

    <text
      id="l3"
      class="l"
      x="50"
      y="110"
      xml:space="preserve"
    >[    0.733100] optee: secure world initialized</text>

    <text
      id="l4"
      class="l"
      x="50"
      y="134"
      xml:space="preserve"
    >[    0.800813] printk: nobody reads these anyway</text>

    <text
      id="l5"
      class="l"
      x="50"
      y="158"
      xml:space="preserve"
    >[    0.813027] printk: if you're reading this, you're either me or you don't have a life</text>

    <text
      id="l6"
      class="l amber"
      x="50"
      y="182"
      xml:space="preserve"
    >[    1.969000] mm: you can free() any time you like, but you can never exit()</text>

    <g id="cur">
      <rect
        id="blink"
        x="50"
        y="195"
        width="8"
        height="14"
        fill="#9aab9e"
        opacity="0"
      />
    </g>

  </g>
</svg>
