<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1000" height="220" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#9fd8ff">
    <circle cx="60" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="60" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="25" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="70" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="20" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="55" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="65" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="35" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="900" cy="45" r="60" fill="url(#moonGlow)"/>
  <circle cx="900" cy="45" r="22" fill="#e8f6ff"/>
  <circle cx="892" cy="38" r="4" fill="#c9e9fb" opacity="0.6"/>
  <circle cx="906" cy="52" r="3" fill="#c9e9fb" opacity="0.5"/>

  <!-- ground -->
  <rect x="0" y="165" width="1000" height="55" fill="url(#ground)"/>
  <line x1="0" y1="165" x2="1000" y2="165" stroke="#1f2c47" stroke-width="1.5"/>
  <!-- terminal grid dashes on ground -->
  <g stroke="#17233c" stroke-width="1">
    <line x1="0" y1="185" x2="1000" y2="185"/>
    <line x1="0" y1="205" x2="1000" y2="205"/>
  </g>

  <!-- ============ PENGUIN ============ -->
  <g id="penguin">
    <g id="penguinWaddle">
      <!-- feet -->
      <polygon points="-10,26 -2,26 -6,32" fill="#f5a623"/>
      <polygon points="2,26 10,26 6,32" fill="#f5a623"/>
      <!-- body -->
      <ellipse cx="0" cy="10" rx="15" ry="20" fill="#101820" stroke="#2a3b57" stroke-width="1"/>
      <!-- belly -->
      <ellipse cx="0" cy="13" rx="9" ry="14" fill="#e8f0f7"/>
      <!-- wings -->
      <ellipse cx="-14" cy="8" rx="4" ry="11" fill="#101820" transform="rotate(-15 -14 8)"/>
      <ellipse cx="14" cy="8" rx="4" ry="11" fill="#101820" transform="rotate(15 14 8)"/>
      <!-- head -->
      <circle cx="0" cy="-10" r="10" fill="#101820"/>
      <!-- eyes -->
      <circle cx="-3.5" cy="-11" r="1.6" fill="#fff"/>
      <circle cx="3.5" cy="-11" r="1.6" fill="#fff"/>
      <circle cx="-3.5" cy="-11" r="0.7" fill="#050810"/>
      <circle cx="3.5" cy="-11" r="0.7" fill="#050810"/>
      <!-- beak -->
      <polygon points="-3,-6 3,-6 0,-2" fill="#f5a623"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 0 30;6 0 30;-6 0 30" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <animateTransform xlink:href="#penguin" href="#penguin"
    attributeName="transform" type="translate"
    values="-30,0; 1030,0" dur="22s" repeatCount="indefinite"/>

</svg>
